name: Build Android

on:
  push:
    branches:
      - ci/build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Check UNITY_LICENSE secret
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "UNITY_LICENSE is missing in repository secrets."
            echo "Please open GitHub settings in UniIDE and configure UNITY_LICENSE before running the build again."
            exit 1
          fi
          echo "UNITY_LICENSE is configured."

      - name: Restore Library Cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Create Unity license validation script
        run: |
          mkdir -p Assets/Editor/UniIDE/Generated
          cat > Assets/Editor/UniIDE/Generated/UnityLicenseValidation.cs <<'EOF'
          using UnityEngine;
          using UnityEditor;

          namespace UniIDE.Generated
          {
              public static class UnityLicenseValidation
              {
                  public static void ValidateLicense()
                  {
                      Debug.Log("UNITY_LICENSE validation succeeded.");
                  }
              }

              public static class AndroidPlayerSettingsPreflight
              {
                  public static void Validate()
                  {
                      Debug.Log("ProjectSettings AndroidTargetArchitectures asset line:");
                      var settingsPath = "ProjectSettings/ProjectSettings.asset";
                      if (System.IO.File.Exists(settingsPath))
                      {
                          foreach (var line in System.IO.File.ReadAllLines(settingsPath))
                          {
                              if (line.TrimStart().StartsWith("AndroidTargetArchitectures:"))
                              {
                                  Debug.Log(line);
                                  break;
                              }
                          }
                      }

                      var architectures = PlayerSettings.Android.targetArchitectures;
                      Debug.Log("PlayerSettings.Android.targetArchitectures before fix: " + architectures);
                      if (architectures == AndroidArchitecture.None)
                      {
                          PlayerSettings.Android.targetArchitectures = AndroidArchitecture.ARM64;
                          AssetDatabase.SaveAssets();
                          Debug.Log("PlayerSettings.Android.targetArchitectures was None. Set to ARM64 for CI build.");
                      }
                      Debug.Log("PlayerSettings.Android.targetArchitectures final: " + PlayerSettings.Android.targetArchitectures);
                  }
              }
          }
          EOF

      - name: Verify Unity license
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2021.3.2f1
          buildMethod: UniIDE.Generated.UnityLicenseValidation.ValidateLicense
          allowDirtyBuild: true

      - name: Check Android Player Settings
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2021.3.2f1
          buildMethod: UniIDE.Generated.AndroidPlayerSettingsPreflight.Validate
          allowDirtyBuild: true


      - name: Build Android
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2021.3.2f1
          allowDirtyBuild: true

          androidExportType: androidPackage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-build
          path: build/Android
          retention-days: 7